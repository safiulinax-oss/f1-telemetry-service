services:
  postgres:
    image: postgres:16-alpine
    container_name: telemetry_service_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry_service
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
